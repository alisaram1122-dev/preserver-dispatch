
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Preserver Trans LLC</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #101c32;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.login-box {
  background: white;
  width: 100%;
  max-width: 410px;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 15px 45px #0005;
}

h1 {
  font-size: 23px;
  color: #172640;
  margin-bottom: 5px;
}

.brand {
  color: #c39437;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 30px;
}

p { color: #8290a3; font-size: 13px; }

label {
  display: block;
  margin: 17px 0 7px;
  font-size: 13px;
  color: #263449;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #dce2ea;
  border-radius: 7px;
  font-size: 14px;
}

button {
  width: 100%;
  margin-top: 23px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #d6a849;
  color: #172640;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .6; }

#message {
  margin-top: 15px;
  font-size: 13px;
  color: #d9534f;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="brand">PRESERVER TRANS LLC</div>
  <h1>Welcome Back</h1>
  <p>Sign in to your Dispatch Management System.</p>

  <form id="loginForm">
    <label>Email Address</label>
    <input id="email" type="email" required
      placeholder="Enter your email">

    <label>Password</label>
    <input id="password" type="password" required
      placeholder="Enter your password">

    <button id="loginButton" type="submit">Sign In</button>
    <div id="message"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "Signing in...";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } =
      await window.supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    const { data: profile, error: profileError } =
      await window.supabaseClient
        .from("profiles")
        .select("username, role, is_active")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile || !profile.is_active) {
      await window.supabaseClient.auth.signOut();
      throw new Error("Account is not active or has no profile.");
    }

    window.location.href = "index.html";

  } catch (error) {
    message.textContent = error.message ||
      "Login failed. Please check your details.";
    button.disabled = false;
    button.textContent = "Sign In";
  }
});
</script>

</body>
</html>
